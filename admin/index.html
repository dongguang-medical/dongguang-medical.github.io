<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>東光醫療器材 — 商品管理</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      /*
        售價這類數字欄位不需要上下微調鍵：價格是直接鍵入的，
        點一下只加一元沒有意義，滑鼠滾輪經過還容易誤改數字。
      */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（官方發行版，unpkg CDN；備援可改用
      https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js）

      介面語言：Sveltia CMS 會依瀏覽器語言自動切換 UI 語言，
      本頁已將 lang 設為 zh-Hant-TW；所有欄位標籤與提示皆已在
      config.yml 中以繁體中文設定，店員看到的操作介面即為中文。
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <!-- 商品編輯的即時預覽樣板；要排在 CMS 之後才拿得到 window.CMS -->
    <script src="preview.js?v=0ee62353e7" type="module"></script>
    <!-- 欄位裡的灰色範例字（Sveltia 沒有 placeholder 設定，由這支補上） -->
    <script src="field-examples.js?v=0ee62353e7" type="module"></script>
    <!-- 依開關顯示／隱藏欄位（例如「有多種價格」打開才出現規格與價格） -->
    <script src="field-rules.js?v=0ee62353e7" type="module"></script>
  </body>
</html>
