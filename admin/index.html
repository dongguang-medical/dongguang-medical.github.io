<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>東光醫療器材 — 商品管理</title>
    <link rel="icon" href="/favicon.ico" />
    <style>
      /*
        售價這類數字欄位不需要上下微調鍵：價格是直接鍵入的，
        點一下只加一元沒有意義，滑鼠滾輪經過還容易誤改數字。
      */
      input[type="number"]::-webkit-outer-spin-button,
      input[type="number"]::-webkit-inner-spin-button {
        -webkit-appearance: none;
        margin: 0;
      }
      input[type="number"] {
        -moz-appearance: textfield;
        appearance: textfield;
      }

      /*
        商品編輯分成「商品資訊」「價格資訊」兩區（像蝦皮）。Sveltia 沒有分區設定，
        這裡在每區第一個欄位上方畫出區塊標題，欄位順序由 config.yml 決定。
        只限有「多種價格」欄位的編輯頁（即商品），品牌頁也有 name 欄位，不受影響。
        純 CSS，不動 Sveltia 的畫面結構；Sveltia 改版時最多是標題不見。
      */
      .content:has(> [data-typed-key-path="has_variants"]) > [data-typed-key-path="name"]::before,
      .content:has(> [data-typed-key-path="has_variants"]) > [data-typed-key-path="has_variants"]::before {
        display: block;
        margin-bottom: 20px;
        padding-bottom: 8px;
        border-bottom: 2px solid currentColor;
        font-size: 17px;
        font-weight: 700;
      }
      .content:has(> [data-typed-key-path="has_variants"]) > [data-typed-key-path="name"]::before {
        content: "商品資訊";
      }
      .content:has(> [data-typed-key-path="has_variants"]) > [data-typed-key-path="has_variants"]::before {
        content: "價格資訊";
        margin-top: 32px;
      }

      /*
        法定標示通常有五、六行（許可證字號、品名、藥商、製造廠、地址），
        Sveltia 預設只有約四行高，範例字會被截掉。加高到約八行，內容更長時照樣自動長高。
      */
      /* 多加 .field 提高優先權：Sveltia 自己的 textarea 樣式比這裡晚載入，同優先權會蓋掉這條 */
      .field[data-typed-key-path="regulatory"] textarea {
        min-height: 216px;
      }
    </style>
  </head>
  <body>
    <!--
      Sveltia CMS（官方發行版，unpkg CDN；備援可改用
      https://cdn.jsdelivr.net/npm/@sveltia/cms/dist/sveltia-cms.js）

      介面語言：Sveltia CMS 會依瀏覽器語言自動切換 UI 語言，
      本頁已將 lang 設為 zh-Hant-TW；所有欄位標籤與提示皆已在
      config.yml 中以繁體中文設定，店員看到的操作介面即為中文。
    -->
    <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js" type="module"></script>
    <!-- 商品編輯的即時預覽樣板；要排在 CMS 之後才拿得到 window.CMS -->
    <script src="preview.js?v=e4c070e06c" type="module"></script>
    <!-- 欄位裡的灰色範例字（Sveltia 沒有 placeholder 設定，由這支補上） -->
    <script src="field-examples.js?v=e4c070e06c" type="module"></script>
    <!-- 依開關顯示／隱藏欄位（例如「多種價格」打開才出現規格與價格） -->
    <script src="field-rules.js?v=e4c070e06c" type="module"></script>
  </body>
</html>
