name: 建置商品目錄

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'         # 商品資料變更
      - 'assets/uploads/**'  # 商品圖片變更
      - 'scripts/**'         # 產生器變更
      - 'admin/*.js'         # 後台自製 JS 變更（更新 admin/index.html 的版本號）

permissions:
  contents: write            # 需要寫入產出的靜態頁面

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # 文章的建立／更新日期由 git log 算出，要完整的提交歷史；淺層 clone 會全部算成同一天。
          # blob:none 只抓提交與目錄紀錄，不下載歷史裡的舊檔案內容（主要是照片），
          # repo 變大後建置也不會跟著變慢；目前版本的檔案照常完整取出
          fetch-depth: 0
          filter: blob:none

      # 卡片縮圖要先產生，build_catalog.py 才找得到並輸出 <picture>；
      # 找不到縮圖時它會退回原圖，不會壞，但圖會變很重
      - name: Install Pillow
        run: pip install --quiet Pillow

      - name: Generate card thumbnails
        run: python3 scripts/make_thumbs.py

      - name: Run catalog builder
        run: python3 scripts/build_catalog.py

      - name: Commit generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 這裡要涵蓋 build_catalog.py 產出的每一個路徑，漏掉的線上就不會更新。
          # 產生器會 rmtree 重建 catalog/category/product/rental/brand/subsidy/articles，
          # 並覆寫根目錄 index.html（首頁＝商品目錄）與 sitemap.xml。
          # about/index.html 是手刻頁，但頁首選單（依有上架商品的子分類）與頁尾
          # 由產生器同步，也要一起提交，不然關於我們頁的選單會落後其他頁。
          git add -A catalog category product rental brand subsidy articles \
                     index.html sitemap.xml robots.txt \
                     assets/images/placeholder.svg assets/thumbs \
                     admin/preview-constants.js admin/index.html \
                     about/index.html
          git diff --staged --quiet && echo "No changes to commit." || \
            git commit -m "chore: 自動建置商品目錄 [skip ci]"
          git push
