name: 建置商品目錄

on:
  push:
    branches:
      - main
    paths:
      - 'content/**'         # 商品資料變更
      - 'assets/uploads/**'  # 商品圖片變更
      - 'scripts/**'         # 產生器變更

permissions:
  contents: write            # 需要寫入產出的靜態頁面

jobs:
  build-catalog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run catalog builder
        run: python3 scripts/build_catalog.py

      - name: Commit generated pages
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # 這裡要涵蓋 build_catalog.py 產出的每一個路徑，漏掉的線上就不會更新。
          # 產生器會 rmtree 重建 catalog/category/product/rental/brand/subsidy，
          # 並覆寫根目錄 index.html（首頁＝商品目錄）與 sitemap.xml。
          git add -A catalog category product rental brand subsidy \
                     index.html sitemap.xml robots.txt assets/images/placeholder.svg
          git diff --staged --quiet && echo "No changes to commit." || \
            git commit -m "chore: 自動建置商品目錄 [skip ci]"
          git push
